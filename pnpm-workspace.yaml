packages:
  - "apps/*"
  - "packages/*"
  - "db"
allowBuilds:
  # Downloads the platform binary that uploads source maps.
  '@sentry/cli': true
  # core-js only postinstalls a funding notice. Nothing needs it to run.
  core-js: false
  # esbuild ships a platform binary that its install script places on disk.
  # vitest depends on it, so the build has to run.
  esbuild: true
  # sharp is Next's image optimiser and the renderer behind the generated share
  # cards, and it needs its platform binary installed.
  sharp: true
