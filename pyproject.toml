[project]
name = "nidhi-pipelines"
version = "0.1.0"
description = "Ingestion pipelines for Nidhi Drishti: India Union Budget transparency platform"
readme = "pipelines/README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Agent layer (agents/). Imported lazily by agents.lib.client, so the test
    # suite runs without it, but a live agent run needs it present.
    "anthropic>=0.69",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    # The Union Budget publishes its Statements of Budget Estimates as xlsx,
    # and the CGA its monthly accounts as xlsm.
    "openpyxl>=3.1",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
    "playwright>=1.44",
    "boto3>=1.34",
    "psycopg[binary]>=3.2",
    "tenacity>=8.3",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "sentry-sdk>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

# ---------------------------------------------------------------------------
# Ruff. Line length 100 keeps the long SQL strings and the equally long
# government column headers readable without wrapping them into nonsense.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "BLE", # blind except: every one has to be justified in a comment
    "SIM", # simplify
    "TID", # tidy imports
    "RUF",
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # call in default arg: used deliberately for frozen defaults
    "RUF001", # ambiguous unicode: the rupee sign and Devanagari are the point
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Nested `with` in tests is deliberate: keeping pytest.raises on its own line
# makes it obvious which statement is expected to raise.
"pipelines/tests/*" = ["S101", "SIM117"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pytest. agents/tests is owned by the agent layer but shares this runner so a
# single command covers the whole Python side of the monorepo.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["pipelines/tests", "agents/tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test that would touch the public internet. Never run in CI.",
]
filterwarnings = ["error::DeprecationWarning:pipelines.*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
exclude = ["node_modules", "\\.venv"]

# Tests pass deliberately narrow doubles (a fake object store, a grid of plain
# strings) where the production signature is wider. That is the point of the
# double, so the structural checks are relaxed here rather than papered over
# with casts in every test.
[[tool.mypy.overrides]]
module = ["pipelines.tests.*", "agents.tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
disable_error_code = ["arg-type", "no-untyped-def"]

[tool.coverage.run]
source = ["pipelines"]
omit = ["pipelines/tests/*"]
